<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visibill</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="description" content="Modern invoice and financial management system" />
    <meta name="author" content="Visibill" />

    <!-- 1. CSS variables – applied INSTANTLY before any paint -->
    <style>
      :root { --initial-bg: #ffffff; --initial-text: #64748b; }
      .dark { --initial-bg: #030712; --initial-text: #94a3b8; }
      html, body {
        background-color: var(--initial-bg) !important;
        color: var(--initial-text) !important;
        margin: 0; padding: 0;
      }
    </style>

    <!-- 2. Theme script – runs BEFORE first paint -->
    <script>
      (function() {
        var theme = localStorage.getItem('visibill_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Montserrat Font (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"></noscript>

    <meta property="og:title" content="Visibill" />
    <meta property="og:description" content="Modern invoice and financial management system" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- 3. Loader styles – use CSS variables for color-correct rendering -->
    <style>
      @keyframes initial-spin { to { transform: rotate(360deg); } }
      #initial-loader {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background-color: var(--initial-bg);
        z-index: 9999;
        transition: opacity 200ms ease-out;
      }
      #initial-loader.fade-out { opacity: 0; pointer-events: none; }
      #initial-loader .spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 4px solid #18b8a0; border-right-color: transparent;
        animation: initial-spin 1s linear infinite;
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
