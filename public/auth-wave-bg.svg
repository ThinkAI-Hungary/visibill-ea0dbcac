<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Teal/Mint glow gradients -->
    <radialGradient id="glow1" cx="25%" cy="50%" r="35%" fx="25%" fy="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="30%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="75%" cy="50%" r="35%" fx="75%" fy="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Sparkle filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1920" height="1080" fill="#030712"/>

  <!-- Background glow orbs -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>

  <!-- Wave layer 1 - Deep teal, large amplitude -->
  <g filter="url(#waveGlow)" opacity="0.6">
    <path d="M0,540 C120,380 240,320 360,420 C480,520 540,620 660,540 C780,460 840,340 960,400 C1080,460 1140,580 1260,520 C1380,460 1500,380 1620,440 C1740,500 1860,560 1920,500" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.7">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M0,540 C120,380 240,320 360,420 C480,520 540,620 660,540 C780,460 840,340 960,400 C1080,460 1140,580 1260,520 C1380,460 1500,380 1620,440 C1740,500 1860,560 1920,500;
