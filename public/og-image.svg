<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#08090a"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14dcaa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Brand name: eaisybill -->
  <text x="600" y="270" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="72">
    <tspan fill="#ffffff">e</tspan><tspan fill="#14dcaa">ai</tspan><tspan fill="#ffffff">sybill</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="28" fill="#8a8f98">
    AI-alapú számla- és pénzügyi menedzsment
  </text>
  
  <!-- Subtle bottom border accent -->
  <rect x="520" y="380" width="160" height="3" rx="1.5" fill="#14dcaa" opacity="0.6"/>
</svg>
