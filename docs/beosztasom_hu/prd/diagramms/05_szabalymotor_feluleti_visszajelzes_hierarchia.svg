<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .grid-pattern { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .title { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 13px; fill: #94a3b8; }
      .header-title { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .txt { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 12px; fill: #cbd5e1; }
      .txt-bold { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .txt-sm { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 11px; fill: #94a3b8; }
      .box { rx: 8px; stroke-width: 1.5; }
      .b-border { stroke: #334155; fill: #1e293b; }
      .b-card { stroke: #334155; fill: #0f172a; rx: 8px; }
      .b-blocker { fill: #450a0a; stroke: #ef4444; }
      .b-error { fill: #7c2d12; stroke: #f97316; }
      .b-warning { fill: #78350f; stroke: #f59e0b; }
      .b-info { fill: #082f49; stroke: #0ea5e9; }
    </style>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid-pattern" />
    </pattern>
  </defs>

  <rect width="1200" height="760" class="bg" />
  <rect width="1200" height="760" fill="url(#grid)" />

  <text x="50" y="45" class="title">PRD-05 · Munkaügyi Szabálymotor Felületi Visszajelző Rendszere</text>
  <text x="50" y="68" class="subtitle">A 4 súlyossági szint vizuális jelvényei, élő riasztási sáv, részletező fiók és felülbírálás</text>

  <!-- Top: The 4 Severity Levels -->
  <g transform="translate(50, 95)">
    <!-- Level 1: Blocker -->
    <rect width="260" height="130" class="box b-blocker" />
    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#fca5a5">🔴 1. TILTÁS (BLOCKER)</text>
    <text x="18" y="52" class="txt-bold" fill="#fff">Mentést Gátló Fizikai Hiba</text>
    <text x="18" y="74" class="txt-sm" fill="#fecaca">• Átfedő műszak ugyanannál</text>
    <text x="18" y="92" class="txt-sm" fill="#fecaca">• Műszak távolléti napon</text>
    <text x="18" y="112" class="txt-sm" fill="#f87171" font-weight="700">Hatás: Mentés gomb tiltva</text>

    <!-- Level 2: Error (Mt.) -->
    <g transform="translate(280, 0)">
      <rect width="260" height="130" class="box b-error" />
      <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#fdba74">🟠 2. JOGI HIBA (ERROR)</text>
      <text x="18" y="52" class="txt-bold" fill="#fff">Mt. Kógens Szabálysértés</text>
      <text x="18" y="74" class="txt-sm" fill="#fed7aa">• Napi 11h pihenőidő hiánya</text>
      <text x="18" y="92" class="txt-sm" fill="#fed7aa">• Heti 48h pihenő elmaradása</text>
      <text x="18" y="112" class="txt-sm" fill="#fb923c" font-weight="700">Hatás: Piros keret + Riasztás</text>
    </g>

    <!-- Level 3: Warning -->
    <g transform="translate(560, 0)">
      <rect width="260" height="130" class="box b-warning" />
      <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#fde68a">🟡 3. FIGYELMEZTETÉS</text>
      <text x="18" y="52" class="txt-bold" fill="#fff">Belső / Preferencia Eltérés</text>
      <text x="18" y="74" class="txt-sm" fill="#fef3c7">• Heti max óra túllépés</text>
      <text x="18" y="92" class="txt-sm" fill="#fef3c7">• Dolgozói kérés sérülése</text>
      <text x="18" y="112" class="txt-sm" fill="#fbbf24" font-weight="700">Hatás: Sárga sarok + Indoklás</text>
    </g>

    <!-- Level 4: Info -->
    <g transform="translate(840, 0)">
      <rect width="260" height="130" class="box b-info" />
      <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#bae6fd">🔵 4. TÁJÉKOZTATÁS</text>
      <text x="18" y="52" class="txt-bold" fill="#fff">Időarányos Keretjelzés</text>
      <text x="18" y="74" class="txt-sm" fill="#e0f2fe">• Munkaidőkeret egyenleg</text>
      <text x="18" y="92" class="txt-sm" fill="#e0f2fe">• Heti vasárnapi pihenőidő</text>
      <text x="18" y="112" class="txt-sm" fill="#38bdf8" font-weight="700">Hatás: Kék badge, menthető</text>
    </g>
  </g>

  <!-- Bottom Part: UI Feedback Showcase -->
  <g transform="translate(50, 245)">
    <!-- Left: Cell indicators Mockup -->
    <rect width="520" height="460" class="box b-border" />
    <text x="24" y="32" class="header-title">CELLASZINTŰ ÉS SORMAGASSÁGI INDIKÁTOROK</text>

    <!-- Grid cell with error -->
    <g transform="translate(24, 55)">
      <rect width="470" height="85" class="b-card" />
      <text x="18" y="26" class="txt-bold">Példa 1: Napi Pihenőidő Sérülése (Kovács István)</text>
      <rect x="18" y="38" width="120" height="38" rx="4" fill="#0284c7" stroke="#f97316" stroke-width="2" />
      <polygon points="18,38 34,38 18,54" fill="#f97316" />
      <text x="38" y="62" class="txt-shift">22:00 - 06:00</text>
      <text x="155" y="52" class="txt-sm" fill="#fdba74">⚠️ Kedd éjszakai műszak után szerda reggel 08:00 kezdés</text>
      <text x="155" y="68" class="txt-sm" fill="#94a3b8">Két műszak közötti pihenő: csak 2.0h (Mt. min. 11h kötelező!)</text>
    </g>

    <!-- Grid cell with overlap Blocker -->
    <g transform="translate(24, 155)">
      <rect width="470" height="85" class="b-card" />
      <text x="18" y="26" class="txt-bold">Példa 2: Fizikai Ütközés / Blocker (Nagy Éva)</text>
      <rect x="18" y="38" width="120" height="38" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
      <text x="30" y="62" class="txt-shift" fill="#fca5a5">ÜTKÖZÉS!</text>
      <text x="155" y="52" class="txt-sm" fill="#fca5a5">⛔ Ugyanazon a napon két eltérő telephelyre beosztva!</text>
      <text x="155" y="68" class="txt-sm" fill="#94a3b8">Nagy Sándor u. (08-16) ÉS Kőrösi üzlet (14-22)</text>
    </g>

    <!-- Employee summary row violation indicator -->
    <g transform="translate(24, 255)">
      <rect width="470" height="85" class="b-card" />
      <text x="18" y="26" class="txt-bold">Példa 3: Havi Munkaidőkeret Túllépés</text>
      <rect x="18" y="42" width="120" height="30" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="26" y="62" class="txt-bold" fill="#fbbf24">192 / 176h (+16h)</text>
      <text x="155" y="52" class="txt-sm" fill="#fde68a">Tervezett túlóra: +16 óra a havi kötelező kereten felül</text>
      <text x="155" y="68" class="txt-sm" fill="#94a3b8">Bérpótlék vonzat: 50% vagy 100% túlórapótlék</text>
    </g>

    <!-- Severity Legend -->
    <g transform="translate(24, 355)">
      <rect width="470" height="80" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="16" y="25" class="txt-sm" font-weight="700" fill="#e2e8f0">Vizuális Kódolás a Rácsban:</text>
      <text x="16" y="45" class="txt-sm">• Narancssárga sarokháromszög a cella bal felső sarkában</text>
      <text x="16" y="63" class="txt-sm">• Tooltip lebegő ablak egér rávitelekor a szabály pontos nevével</text>
    </g>
  </g>

  <!-- Right: Rule Violation Drawer Mockup -->
  <g transform="translate(590, 245)">
    <rect width="560" height="460" class="box b-border" stroke="#f59e0b" />
    <text x="24" y="32" class="header-title" fill="#fbbf24">SZABÁLYSÉRTÉSI RÉSZLETEZŐ FIÓK (DRAWER)</text>

    <!-- Violation Item 1 -->
    <g transform="translate(20, 50)">
      <rect width="520" height="115" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1" />
      <rect x="16" y="14" width="75" height="20" rx="4" fill="#ea580c" />
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" fill="#fff">Mt. 104. §</text>
      <text x="100" y="28" class="txt-bold" fill="#fff">Napi Pihenőidő Hiánya (2.0h &lt; 11.0h)</text>
      
      <text x="16" y="52" class="txt-sm">• Dolgozó: Kovács István (Pultos)</text>
      <text x="16" y="68" class="txt-sm">• Érintett időpontok: Szept 2. 22:00-06:00 → Szept 3. 08:00-16:30</text>
      <text x="16" y="86" class="txt-sm" fill="#38bdf8">Javasolt megoldás: Szept 3-i műszak kezdése tolható 17:00-ra</text>

      <rect x="410" y="80" width="95" height="26" rx="4" fill="#334155" stroke="#475569" />
      <text x="424" y="97" class="txt-sm" fill="#fff">Áthelyezés</text>
    </g>

    <!-- Violation Item 2 -->
    <g transform="translate(20, 180)">
      <rect width="520" height="115" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <rect x="16" y="14" width="75" height="20" rx="4" fill="#dc2626" />
      <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" fill="#fff">BLOCKER</text>
      <text x="100" y="28" class="txt-bold" fill="#fff">Átfedő Műszak Két Munkahelyen</text>
      
      <text x="16" y="52" class="txt-sm">• Dolgozó: Nagy Éva (Szakács)</text>
      <text x="16" y="68" class="txt-sm">• Dátum: Szept 4. Péntek</text>
      <text x="16" y="86" class="txt-sm" fill="#f87171">A dolgozó egyszerre nem lehet két üzletben!</text>

      <rect x="410" y="80" width="95" height="26" rx="4" fill="#991b1b" stroke="#ef4444" />
      <text x="428" y="97" class="txt-sm" fill="#fff">Egyik törlése</text>
    </g>

    <!-- Override Box -->
    <g transform="translate(20, 310)">
      <rect width="520" height="130" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="16" y="25" class="txt-bold" fill="#fde68a">Üzemeltetői / Vezetői Felülbírálás</text>
      <text x="16" y="46" class="txt-sm">A sárga és narancssárga figyelmeztetések felülbírálhatók,</text>
      <text x="16" y="62" class="txt-sm">ha a cégvezető/könyvelő indoklást ad meg (pl. „Munkavállaló kérésére”).</text>
      <rect x="16" y="78" width="350" height="34" rx="4" fill="#0f172a" stroke="#64748b" />
      <text x="26" y="99" class="txt-sm" fill="#64748b">Kötelező felülbírálási indoklás beírása...</text>
      <rect x="380" y="78" width="125" height="34" rx="4" fill="#0284c7" />
      <text x="398" y="99" class="txt-bold">Felülbírálás</text>
    </g>
  </g>
</svg>