<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .grid-pattern { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .title { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 13px; fill: #94a3b8; }
      .header-title { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .txt { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 12px; fill: #cbd5e1; }
      .txt-bold { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .txt-sm { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 11px; fill: #94a3b8; }
      .txt-badge { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .box { rx: 8px; stroke-width: 1.5; }
      .b-border { stroke: #334155; fill: #1e293b; }
      .b-modal { stroke: #38bdf8; stroke-width: 2; fill: #0f172a; rx: 10px; }
      .b-input { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 6px; }
      .b-btn-primary { fill: #0284c7; stroke: #38bdf8; rx: 6px; }
      .b-btn-sec { fill: #334155; stroke: #475569; rx: 6px; }
      .b-btn-danger { fill: #991b1b; stroke: #ef4444; rx: 6px; }
      .state-box { rx: 8px; stroke-width: 1.5; fill: #1e293b; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid-pattern" />
    </pattern>
  </defs>

  <rect width="1200" height="760" class="bg" />
  <rect width="1200" height="760" fill="url(#grid)" />

  <text x="50" y="45" class="title">PRD-03 · Műszakszerkesztő Dialógus és UI Állapotgép</text>
  <text x="50" y="68" class="subtitle">Adatbeviteli mezők, dinamikus óraszámítás és mentési validációs folyamat</text>

  <!-- Left Side: UI Dialog Mockup -->
  <g transform="translate(50, 95)">
    <rect width="520" height="610" class="b-modal" />
    
    <!-- Modal Header -->
    <rect width="520" height="50" rx="10" fill="#1e293b" />
    <text x="24" y="32" class="header-title">Műszak szerkesztése · Kovács István</text>
    <text x="480" y="32" font-family="'JetBrains Mono', monospace" font-size="16px" fill="#94a3b8">✕</text>

    <!-- Date display -->
    <text x="24" y="75" class="txt-sm">DÁTUM ÉS NAP</text>
    <text x="24" y="95" class="txt-bold" fill="#38bdf8">2026. szeptember 3. (Csütörtök)</text>

    <!-- Work Shift Times Form Group -->
    <g transform="translate(24, 115)">
      <text x="0" y="15" class="txt-sm">MŰSZAK KEZDETE</text>
      <rect x="0" y="24" width="220" height="38" class="b-input" />
      <text x="14" y="48" class="txt-bold">08:00</text>

      <text x="250" y="15" class="txt-sm">MŰSZAK VÉGE</text>
      <rect x="250" y="24" width="220" height="38" class="b-input" />
      <text x="264" y="48" class="txt-bold">16:30</text>
    </g>

    <!-- Break and Net Hours -->
    <g transform="translate(24, 195)">
      <text x="0" y="15" class="txt-sm">FIZETETLEN PIHENŐIDŐ</text>
      <rect x="0" y="24" width="220" height="38" class="b-input" />
      <text x="14" y="48" class="txt">30 perc (Alapértelmezett)</text>

      <!-- Live Calculation Card -->
      <rect x="250" y="10" width="220" height="52" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5" />
      <text x="264" y="32" class="txt-sm" fill="#93c5fd">SZÁMÍTOTT MUNKAIDŐ</text>
      <text x="264" y="52" font-family="'JetBrains Mono', monospace" font-size="16px" font-weight="700" fill="#38bdf8">8.0 óra</text>
    </g>

    <!-- Workplace & Job Position -->
    <g transform="translate(24, 275)">
      <text x="0" y="15" class="txt-sm">MUNKAHELY / TELEPHELY</text>
      <rect x="0" y="24" width="470" height="38" class="b-input" />
      <text x="14" y="48" class="txt">Nagy Sándor utcai üzlet ▾</text>
    </g>

    <g transform="translate(24, 350)">
      <text x="0" y="15" class="txt-sm">MUNKAKÖR</text>
      <rect x="0" y="24" width="470" height="38" class="b-input" />
      <text x="14" y="48" class="txt">Pultos / Értékesítő (Kék kód) ▾</text>
    </g>

    <!-- Options & Checkboxes -->
    <g transform="translate(24, 425)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#0284c7" />
      <text x="6" y="15" fill="#fff" font-size="12px">✓</text>
      <text x="32" y="15" class="txt">Home office munkavégzés jelölése</text>

      <text x="0" y="45" class="txt-sm">MEGJEGYZÉS (OPCIONÁLIS)</text>
      <rect x="0" y="54" width="470" height="40" class="b-input" />
      <text x="14" y="78" class="txt-sm" fill="#64748b">Pl. Rendkívüli nyitás, leltár...</text>
    </g>

    <!-- Modal Actions Footer -->
    <g transform="translate(24, 545)">
      <rect x="0" y="0" width="85" height="38" class="b-btn-danger" />
      <text x="18" y="24" class="txt-bold">Törlés</text>

      <rect x="185" y="0" width="95" height="38" class="b-btn-sec" />
      <text x="210" y="24" class="txt">Mégse</text>

      <rect x="295" y="0" width="175" height="38" class="b-btn-primary" />
      <text x="325" y="24" class="txt-bold">Mentés a rácsba</text>
    </g>
  </g>

  <!-- Right Side: Interaction State Machine -->
  <g transform="translate(610, 95)">
    <rect width="540" height="610" class="box b-border" />
    <text x="24" y="35" class="header-title">MŰSZAK ÉLETCIKLUS ÉS VALIDÁCIÓS FOLYAMAT</text>

    <!-- State 1: Open trigger -->
    <g transform="translate(30, 60)">
      <rect width="480" height="75" class="state-box" stroke="#38bdf8" />
      <text x="20" y="28" class="txt-bold" fill="#38bdf8">1. Művelet Indítása (Triggerek)</text>
      <text x="20" y="48" class="txt-sm">• Üres vagy kitöltött cellára duplakattintás</text>
      <text x="20" y="64" class="txt-sm">• Gyorsbillentyű (Enter / Space) kijelölt cellán</text>
    </g>

    <line x1="270" y1="135" x2="270" y2="165" class="arrow" />

    <!-- State 2: Input & Live Calculation -->
    <g transform="translate(30, 165)">
      <rect width="480" height="85" class="state-box" stroke="#a78bfa" />
      <text x="20" y="28" class="txt-bold" fill="#a78bfa">2. Adatbevitel &amp; Valós Idejű Kalkuláció</text>
      <text x="20" y="48" class="txt-sm">• Kezdés/Vége bevitelekor azonnali óraszámítás</text>
      <text x="20" y="64" class="txt-sm">• Nettó munkaidő = (Befejezés - Kezdés) - Pihenőidő</text>
      <text x="20" y="78" class="txt-sm">• Cég/Telephely alapértelmezett szünet automatikus kitöltése</text>
    </g>

    <line x1="270" y1="250" x2="270" y2="280" class="arrow" />

    <!-- State 3: Rule Validation Engine -->
    <g transform="translate(30, 280)">
      <rect width="480" height="95" class="state-box" stroke="#fbbf24" />
      <text x="20" y="28" class="txt-bold" fill="#fbbf24">3. Kliensoldali Szabályellenőrzés (Pre-Validation)</text>
      <text x="20" y="48" class="txt-sm">• Napi max 12 óra ellenőrzése</text>
      <text x="20" y="64" class="txt-sm">• Átfedő műszak vizsgálata ugyanannál a dolgozónál (Blocker)</text>
      <text x="20" y="78" class="txt-sm">• Távolléti nap ütközés vizsgálata (Szabadság alatt tilos műszak)</text>
      <text x="20" y="92" class="txt-sm">• 11 órás pihenőidő előző/következő nap viszonylatában</text>
    </g>

    <line x1="270" y1="375" x2="270" y2="405" class="arrow" />

    <!-- State 4: Optimistic Save & UI Commit -->
    <g transform="translate(30, 405)">
      <rect width="480" height="80" class="state-box" stroke="#34d399" />
      <text x="20" y="28" class="txt-bold" fill="#34d399">4. Optimista Mentés &amp; Rács Frissítés</text>
      <text x="20" y="48" class="txt-sm">• Modal azonnali zárása, a cella vizuálisan frissül (&lt;50ms)</text>
      <text x="20" y="64" class="txt-sm">• Dolgozói havi óraszámláló és létszámigény sáv újraszámolása</text>
      <text x="20" y="78" class="txt-sm">• Művelet bejegyzése a Visszavonás (Undo) stackbe</text>
    </g>

    <line x1="270" y1="485" x2="270" y2="515" class="arrow" />

    <!-- State 5: Bulk Options -->
    <g transform="translate(30, 515)">
      <rect width="480" height="75" class="state-box" stroke="#38bdf8" />
      <text x="20" y="26" class="txt-bold" fill="#38bdf8">5. Opcionális Gyorsműveletek</text>
      <text x="20" y="46" class="txt-sm">• „Másolás a hét többi napjára” (Hétvége/Ünnepnap szűréssel)</text>
      <text x="20" y="62" class="txt-sm">• „Mentés sablonként” jövőbeli ismétlődő használatra</text>
    </g>
  </g>
</svg>