      <text x="15" y="26" class="txt-bold">Nagy Éva</text>
      <text x="15" y="44" class="txt-sm">Munkakör: Szakács / Konyhafőnök</text>
      <text x="15" y="62" class="txt-sm">Havi keret: <tspan fill="#fbbf24" font-weight="700">96 / 176 óra</tspan></text>
      <text x="15" y="78" class="txt-sm">Fizetett szabi: 8 nap maradt</text>

      <!-- Day 1 & 2 Paid Leave -->
      <rect x="250" y="0" width="110" height="85" class="box b-cell" />
      <rect x="255" y="10" width="100" height="65" class="b-absence" />
      <text x="265" y="35" class="txt-shift" fill="#93c5fd">🏖️ Szabadság</text>
      <text x="265" y="55" class="txt-shift-sub">Fizetett (8.0h)</text>

      <rect x="360" y="0" width="110" height="85" class="box b-cell" />
      <rect x="365" y="10" width="100" height="65" class="b-absence" />
      <text x="375" y="35" class="txt-shift" fill="#93c5fd">🏖️ Szabadság</text>
      <text x="375" y="55" class="txt-shift-sub">Fizetett (8.0h)</text>

      <!-- Day 3, 4, 5 Shift -->
      <rect x="470" y="0" width="110" height="85" class="box b-cell" />
      <rect x="475" y="10" width="100" height="65" class="b-shift-amber" />
      <text x="483" y="32" class="txt-shift">10:00 - 18:30</text>
      <text x="483" y="50" class="txt-shift-sub" fill="#fef3c7">8.0h · Melegkonyha</text>
      <text x="483" y="65" class="txt-shift-sub" fill="#fef3c7">Kőrösi üzlet</text>

      <rect x="580" y="0" width="110" height="85" class="box b-cell" />
      <rect x="585" y="10" width="100" height="65" class="b-shift-amber" />
      <text x="593" y="32" class="txt-shift">10:00 - 18:30</text>
      <text x="593" y="50" class="txt-shift-sub" fill="#fef3c7">8.0h · Melegkonyha</text>
      <text x="593" y="65" class="txt-shift-sub" fill="#fef3c7">Kőrösi üzlet</text>

      <rect x="690" y="0" width="110" height="85" class="box b-cell" />
      <rect x="695" y="10" width="100" height="65" class="b-shift-amber" />
      <text x="703" y="32" class="txt-shift">10:00 - 18:30</text>
      <text x="703" y="50" class="txt-shift-sub" fill="#fef3c7">8.0h · Melegkonyha</text>
      <text x="703" y="65" class="txt-shift-sub" fill="#fef3c7">Kőrösi üzlet</text>

      <!-- Weekend -->
      <rect x="800" y="0" width="110" height="85" class="box b-cell-weekend" />
      <text x="830" y="47" class="txt-sm" fill="#64748b">Pihenőnap</text>
      <rect x="910" y="0" width="110" height="85" class="box b-cell-weekend" />
      <text x="940" y="47" class="txt-sm" fill="#64748b">Pihenőnap</text>

      <!-- Summary -->
      <rect x="1020" y="0" width="80" height="85" class="box b-cell" />
      <text x="1035" y="38" class="txt-bold" fill="#fbbf24">40.0h</text>
      <text x="1030" y="56" class="txt-sm">2 szabi+3m</text>
    </g>

    <!-- Bottom Requirement Summary Bar (Létszámigény) -->
    <g transform="translate(0, 210)">
      <rect width="250" height="45" class="box b-border" />
      <text x="15" y="27" class="header-title" fill="#38bdf8">LÉTSZÁMIGÉNY (Nagy S.)</text>

      <!-- Day totals: Planned / Required -->
      <rect x="250" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="275" y="27" class="txt-bold" fill="#34d399">5 / 5 fő ✓</text>

      <rect x="360" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="385" y="27" class="txt-bold" fill="#34d399">5 / 5 fő ✓</text>

      <rect x="470" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="495" y="27" class="txt-bold" fill="#f87171">4 / 5 fő ⚠️</text>

      <rect x="580" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="605" y="27" class="txt-bold" fill="#34d399">5 / 5 fő ✓</text>

      <rect x="690" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="715" y="27" class="txt-bold" fill="#34d399">6 / 5 fő (+1)</text>

      <rect x="800" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="825" y="27" class="txt-sm" fill="#94a3b8">2 / 2 fő</text>

      <rect x="910" y="0" width="110" height="45" stroke="#334155" fill="#1e293b" />
      <text x="935" y="27" class="txt-sm" fill="#94a3b8">ZÁRVA</text>

      <rect x="1020" y="0" width="80" height="45" stroke="#334155" fill="#1e293b" />
      <text x="1035" y="27" class="txt-bold" fill="#38bdf8">98%</text>
    </g>
  </g>

  <!-- Interactive Shortcuts & Legend footer -->
  <g transform="translate(50, 490)">
    <rect width="1100" height="45" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="27" class="txt-sm"><tspan font-weight="700" fill="#38bdf8">Gyorsbillentyűk:</tspan> Ctrl+C: Másolás · Ctrl+V: Beillesztés · Del: Műszak törlése · Húzás: Cella kitöltése · Shift+Kattintás: Tartomány</text>
    <circle cx="850" cy="22" r="6" fill="#0284c7" />
    <text x="862" y="26" class="txt-sm">Műszak</text>
    <circle cx="930" cy="22" r="6" fill="#1e3a8a" stroke="#60a5fa" />
    <text x="942" y="26" class="txt-sm">Távollét</text>
    <circle cx="1020" cy="22" r="6" fill="#f87171" />
    <text x="1032" y="26" class="txt-sm">Létszámhiány</text>
  </g>
</svg>