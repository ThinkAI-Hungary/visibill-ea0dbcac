      <text x="483" y="65" class="txt-shift-sub">Nagy Sándor u.</text>

      <rect x="580" y="0" width="110" height="85" class="box b-cell" />
      <rect x="585" y="10" width="100" height="65" class="b-shift" />
      <text x="593" y="32" class="txt-shift">08:00 - 16:30</text>
      <text x="593" y="50" class="txt-shift-sub">8.0h · 30p szünet</text>
      <text x="593" y="65" class="txt-shift-sub">Nagy Sándor u.</text>

      <rect x="690" y="0" width="110" height="85" class="box b-cell" />
      <rect x="695" y="10" width="100" height="65" class="b-shift" />
      <text x="703" y="32" class="txt-shift">08:00 - 16:30</text>
      <text x="703" y="50" class="txt-shift-sub">8.0h · 30p szünet</text>
      <text x="703" y="65" class="txt-shift-sub">Nagy Sándor u.</text>

