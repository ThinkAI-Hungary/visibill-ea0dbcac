<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .grid-pattern { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .title { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 13px; fill: #94a3b8; }
      .header-title { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 13px; font-weight: 700; fill: #e2e8f0; }
      .txt { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 12px; fill: #cbd5e1; }
      .txt-bold { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .txt-sm { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 10px; fill: #94a3b8; }
      .txt-badge { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .txt-shift { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 11px; font-weight: 700; fill: #f8fafc; }
      .txt-shift-sub { font-family: 'JetBrains Mono', 'Segoe UI', monospace; font-size: 9px; fill: #93c5fd; }
      .box { rx: 6px; stroke-width: 1.5; }
      .b-border { stroke: #334155; fill: #1e293b; }
      .b-cell { stroke: #334155; fill: #0f172a; }
      .b-cell-weekend { stroke: #334155; fill: #1e1b4b; fill-opacity: 0.4; }
      .b-shift { fill: #0284c7; stroke: #38bdf8; stroke-width: 1; rx: 4px; }
      .b-shift-amber { fill: #d97706; stroke: #fcd34d; stroke-width: 1; rx: 4px; }
      .b-absence { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1; rx: 4px; }
      .b-selected { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 4 2; fill: #0284c7; fill-opacity: 0.2; }
    </style>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid-pattern" />
    </pattern>
  </defs>

  <rect width="1200" height="760" class="bg" />
  <rect width="1200" height="760" fill="url(#grid)" />

  <text x="50" y="45" class="title">PRD-02 · Havi Beosztástervező Naptárrács UI Mockup és Interakciók</text>
  <text x="50" y="68" class="subtitle">Fejléc vezérlők, dolgozói swimlane sorok, cellaműveletek, vágólap és létszámigény összesítő</text>

  <!-- Control & Filter Toolbar -->
  <g transform="translate(50, 88)">
    <rect width="1100" height="52" class="box b-border" />
    <!-- Filters -->
    <rect x="15" y="10" width="150" height="32" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="25" y="30" class="txt">🏢 Összes üzlet ▾</text>

    <rect x="175" y="10" width="150" height="32" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="185" y="30" class="txt">💼 Munkakörök ▾</text>

    <rect x="335" y="10" width="130" height="32" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="345" y="30" class="txt">🎨 Színezés: Cég ▾</text>

    <!-- Quick action buttons -->
    <rect x="490" y="10" width="130" height="32" rx="4" fill="#0284c7" stroke="#38bdf8" />
    <text x="502" y="30" class="txt-bold">⚡ Auto-kitöltés</text>

    <rect x="630" y="10" width="110" height="32" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="642" y="30" class="txt">📋 Sablonból</text>

    <rect x="750" y="10" width="90" height="32" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="760" y="30" class="txt">↩ Vissza</text>

    <rect x="850" y="10" width="90" height="32" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="760" y="30" class="txt"></text>
    <text x="860" y="30" class="txt">↪ Mégis</text>

    <rect x="960" y="10" width="125" height="32" rx="4" fill="#10b981" stroke="#34d399" />
    <text x="975" y="30" class="txt-bold">💾 Mentés &amp; Zárás</text>
  </g>

  <!-- Live Compliance Status Bar -->
  <g transform="translate(50, 148)">
    <rect width="1100" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="23" font-family="'JetBrains Mono', monospace" font-size="12px" font-weight="700" fill="#34d399">✓ A beosztás megfelel a Munka Törvénykönyve szabályainak (0 hiba, 0 tiltás)</text>
    <rect x="940" y="7" width="145" height="22" rx="4" fill="#047857" />
    <text x="950" y="22" class="txt-badge">Szabályok áttekintése ▾</text>
  </g>

