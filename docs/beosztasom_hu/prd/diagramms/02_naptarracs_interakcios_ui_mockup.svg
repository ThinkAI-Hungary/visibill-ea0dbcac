    <rect x="250" y="0" width="110" height="40" stroke="#334155" fill="#1e293b" />
    <text x="275" y="18" class="txt-bold">Szept 1</text>
    <text x="280" y="32" class="txt-sm">Hétfő</text>

    <!-- Day 2 Tue -->
    <rect x="360" y="0" width="110" height="40" stroke="#334155" fill="#1e293b" />
    <text x="385" y="18" class="txt-bold">Szept 2</text>
    <text x="390" y="32" class="txt-sm">Kedd</text>

    <!-- Day 3 Wed -->
    <rect x="470" y="0" width="110" height="40" stroke="#334155" fill="#1e293b" />
    <text x="495" y="18" class="txt-bold">Szept 3</text>
    <text x="500" y="32" class="txt-sm">Szerda</text>

    <!-- Day 4 Thu -->
    <rect x="580" y="0" width="110" height="40" stroke="#334155" fill="#1e293b" />
    <text x="605" y="18" class="txt-bold">Szept 4</text>
    <text x="610" y="32" class="txt-sm">Csütörtök</text>

    <!-- Day 5 Fri -->
    <rect x="690" y="0" width="110" height="40" stroke="#334155" fill="#1e293b" />
    <text x="715" y="18" class="txt-bold">Szept 5</text>
