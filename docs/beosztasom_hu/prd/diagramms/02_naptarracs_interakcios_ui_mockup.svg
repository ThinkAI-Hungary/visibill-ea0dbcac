      <rect x="800" y="0" width="110" height="85" class="box b-cell-weekend" />
      <text x="830" y="47" class="txt-sm" fill="#64748b">Pihenőnap</text>
      <rect x="910" y="0" width="110" height="85" class="box b-cell-weekend" />
      <text x="940" y="47" class="txt-sm" fill="#64748b">Pihenőnap</text>

      <!-- Summary -->
      <rect x="1020" y="0" width="80" height="85" class="box b-cell" />
      <text x="1035" y="38" class="txt-bold" fill="#38bdf8">40.0h</text>
      <text x="1035" y="56" class="txt-sm">5 nap</text>
    </g>

    <!-- Row 2: Nagy Éva (Absence sample) -->
