    <rect x="800" y="0" width="110" height="40" stroke="#334155" fill="#312e81" />
    <text x="825" y="18" class="txt-bold" fill="#a5b4fc">Szept 6</text>
    <text x="830" y="32" class="txt-sm" fill="#c7d2fe">Szombat</text>

    <!-- Day 7 Sun (Weekend) -->
    <rect x="910" y="0" width="110" height="40" stroke="#334155" fill="#312e81" />
    <text x="935" y="18" class="txt-bold" fill="#a5b4fc">Szept 7</text>
    <text x="940" y="32" class="txt-sm" fill="#c7d2fe">Vasárnap</text>

