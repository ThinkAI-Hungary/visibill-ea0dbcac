    <text x="12" y="64" fill="#94a3b8" font-size="8">• Kezdési &amp; befejezési idő (HH:MM)</text>
    <text x="12" y="78" fill="#94a3b8" font-size="8">• Pihenőidő levonás (perc)</text>
    <text x="12" y="92" fill="#22d3ee" font-size="8">• Számított nettó munkaidő (óra)</text>
    <text x="12" y="106" fill="#94a3b8" font-size="8">• Munkakör &amp; Műszak típusa</text>
    <text x="12" y="120" fill="#94a3b8" font-size="8">• Otthoni munkavégzés jelölő</text>
    <text x="12" y="134" fill="#94a3b8" font-size="8">• Opcionális megjegyzés</text>
  </g>

