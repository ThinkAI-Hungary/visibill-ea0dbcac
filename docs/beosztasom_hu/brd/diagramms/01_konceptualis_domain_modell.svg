    <rect width="200" height="105" rx="8" fill="rgba(30,41,59,0.7)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">MUNKAHELY / TELEPHELY</text>
    <line x1="0" y1="34" x2="200" y2="34" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.6"/>
