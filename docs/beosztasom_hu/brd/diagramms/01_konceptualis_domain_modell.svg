    <text x="8" y="62" fill="#94a3b8" font-size="7.5">• Kód (TL-01..28)</text>
    <text x="8" y="76" fill="#94a3b8" font-size="7.5">• Kieső idő jelölő</text>
    <text x="8" y="90" fill="#94a3b8" font-size="7.5">• Szabadságkeret-e</text>
