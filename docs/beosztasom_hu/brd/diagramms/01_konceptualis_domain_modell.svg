  <g transform="translate(690, 470)">
    <rect width="165" height="115" rx="8" fill="#0f172a"/>
    <rect width="165" height="115" rx="8" fill="rgba(30,41,59,0.7)" stroke="#94a3b8" stroke-width="1.5"/>
