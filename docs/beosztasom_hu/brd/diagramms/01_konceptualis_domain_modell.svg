    <rect width="220" height="135" rx="8" fill="rgba(8,51,68,0.7)" stroke="#22d3ee" stroke-width="2"/>
    <text x="110" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">MUNKAVÁLLALÓ</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="12" y="50" fill="#e2e8f0" font-size="8.5">• Név, adóazonosító, TAJ szám</text>
    <text x="12" y="64" fill="#94a3b8" font-size="8">• Jogviszony kezdete / vége</text>
    <text x="12" y="78" fill="#94a3b8" font-size="8">• Mt. típus (teljes, diák, kismama)</text>
