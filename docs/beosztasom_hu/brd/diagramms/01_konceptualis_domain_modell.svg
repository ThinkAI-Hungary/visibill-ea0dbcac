    <text x="12" y="64" fill="#94a3b8" font-size="8">• Kezdő &amp; záró naptári nap</text>
    <text x="12" y="78" fill="#fbbf24" font-size="8">• Státusz: Tervezet / Lezárt</text>
    <text x="12" y="92" fill="#94a3b8" font-size="8">• Munkaügyi megfelelőség: OK</text>
    <text x="12" y="104" fill="#94a3b8" font-size="7.5">• Módosítási napló kötött</text>
  </g>

