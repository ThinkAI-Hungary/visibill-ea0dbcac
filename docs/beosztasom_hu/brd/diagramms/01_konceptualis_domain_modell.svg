  <g transform="translate(700, 180)">
    <rect width="150" height="105" rx="8" fill="#0f172a"/>
    <rect width="150" height="105" rx="8" fill="rgba(30,41,59,0.7)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="75" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">MŰSZAKSABLON</text>
    <line x1="0" y1="34" x2="150" y2="34" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="10" y="50" fill="#e2e8f0" font-size="8.5">• Megnevezés (Délelőttös)</text>
    <text x="10" y="64" fill="#94a3b8" font-size="8">• Kezdés &amp; Végzés időpont</text>
    <text x="10" y="78" fill="#94a3b8" font-size="8">• Levonandó pihenőidő</text>
    <text x="10" y="92" fill="#94a3b8" font-size="8">• Újrafelhasználható minta</text>
