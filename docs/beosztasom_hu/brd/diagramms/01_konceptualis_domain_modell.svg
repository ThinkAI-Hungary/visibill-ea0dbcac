    <rect width="160" height="105" rx="8" fill="rgba(30,41,59,0.7)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">MUNKAKÖR</text>
