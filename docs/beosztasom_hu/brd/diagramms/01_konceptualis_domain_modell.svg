    <text x="12" y="64" fill="#94a3b8" font-size="8">• Dolgozónként külön munkalap</text>
    <text x="12" y="78" fill="#34d399" font-size="8">• Terv (Beosztás) &amp; Tény (Jelenlét)</text>
