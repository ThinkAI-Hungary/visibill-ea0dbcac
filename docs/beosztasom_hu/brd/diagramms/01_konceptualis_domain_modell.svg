    <text x="10" y="64" fill="#a78bfa" font-size="8">• Hivatalos típus azonosító</text>
    <text x="10" y="78" fill="#94a3b8" font-size="8">• Kieső idő-e (táppénz)</text>
    <text x="10" y="92" fill="#94a3b8" font-size="8">• Keretet csökkenti-e</text>
    <text x="10" y="106" fill="#fb7185" font-size="8">• Blokkolja a műszakot!</text>
  </g>

  <!-- ENTITY 10: MUSZAK (Center Lower) -->
  <g transform="translate(460, 440)">
    <rect width="200" height="145" rx="8" fill="#0f172a"/>
    <rect width="200" height="145" rx="8" fill="rgba(8,51,68,0.7)" stroke="#22d3ee" stroke-width="2"/>
    <text x="100" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">MŰSZAK (Tervezett)</text>
    <line x1="0" y1="34" x2="200" y2="34" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.6"/>
