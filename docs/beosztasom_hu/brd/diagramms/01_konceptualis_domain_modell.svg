  <g transform="translate(875, 180)">
    <rect width="200" height="110" rx="8" fill="#0f172a"/>
    <rect width="200" height="110" rx="8" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="1.8"/>
