  <g transform="translate(270, 470)">
    <rect width="165" height="115" rx="8" fill="#0f172a"/>
    <rect width="165" height="115" rx="8" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="82" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">TÁVOLLÉT</text>
    <line x1="0" y1="34" x2="165" y2="34" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.6"/>
