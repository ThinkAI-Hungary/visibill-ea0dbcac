    <text x="12" y="64" fill="#94a3b8" font-size="8">• Cím, fizikai helyszín</text>
    <text x="12" y="78" fill="#94a3b8" font-size="8">• Alapértelmezett munkahely jelölő</text>
    <text x="12" y="92" fill="#94a3b8" font-size="8">• Alapértelmezett sablon kapcsolat</text>
  </g>

