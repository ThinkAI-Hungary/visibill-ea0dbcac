<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.7"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title Block -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="800">15 NAPOS BETEGSZABADSÁG ÉS TÁPPÉNZ ÁTFORDULÁSI MOTOR</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12" font-weight="500">A keresőképtelenségi időszakok automatikus kettéválasztása és bérfeladási jogcímsorolása az Mt. 126. § és az Ebtv. alapján</text>
  </g>

  <!-- ==================== FLOWCHART NODES ==================== -->

  <!-- Node 1: Start (Orvosi igazolás bejelentése) -->
  <g transform="translate(480, 95)">
    <rect width="400" height="66" rx="20" fill="rgba(8, 51, 68, 0.7)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="28" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Keresőképtelenség Bejelentése</text>
    <text x="200" y="48" fill="#bae6fd" font-size="10" text-anchor="middle">Orvosi igazolás felvitele (pl. okt. 5. – nov. 2., összesen 20 munkanap)</text>
  </g>

  <!-- Arrow down to Node 2 -->
  <path d="M 680 161 L 680 195" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Node 2: Keretellenőrzés és Göngyölítés -->
  <g transform="translate(440, 195)">
    <rect width="480" height="92" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="#64748b" stroke-width="1.5"/>
    <text x="20" y="26" fill="#38bdf8" font-size="11" font-weight="700">TÁRGYÉVI GÖNGYÖLÍTETT EGYENLEG LEKÉRDEZÉSE</text>
    <text x="20" y="46" fill="#cbd5e1" font-size="10">• Éves törvényes keret: 15 munkanap (vagy év közbeni belépéskor arányosítva)</text>
    <text x="20" y="64" fill="#cbd5e1" font-size="10">• Tárgyévben eddig igénybe vett betegszabadság napok száma: K_hasznalt</text>
    <text x="20" y="82" fill="#cbd5e1" font-size="10">• Aktuális fennmaradó egyenleg: <tspan fill="#34d399" font-weight="700">K_maradek = Max(0, 15 - K_hasznalt)</tspan></text>
  </g>

  <!-- Arrow down to Decision Diamond -->
  <path d="M 680 287 L 680 325" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Decision Node: Diamond -->
  <!-- Diamond center at (680, 390). Width = 360, Height = 130 -->
  <g transform="translate(680, 390)">
    <polygon points="0,-65 180,0 0,65 -180,0" fill="rgba(120, 53, 15, 0.75)" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="-12" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">A távollét napjai</text>
    <text x="0" y="6" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">meghaladják a maradék keretet?</text>
    <text x="0" y="26" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">(Távollét &gt; K_maradek ?)</text>
  </g>

  <!-- ==================== BRANCH LEFT: NEM (Nincs átfordulás) ==================== -->
  <!-- Arrow left and down -->
  <path d="M 500 390 L 260 390 L 260 480" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <rect x="330" y="372" width="70" height="20" rx="4" fill="rgba(6, 78, 59, 0.9)" stroke="#34d399" stroke-width="1"/>
  <text x="365" y="386" fill="#a7f3d0" font-size="9.5" font-weight="700" text-anchor="middle">NEM (≤ 15)</text>

  <!-- Box Branch Left: Csak Betegszabadság -->
  <g transform="translate(80, 480)">
    <rect width="360" height="210" rx="8" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1.5"/>
    <rect width="360" height="34" rx="8" fill="rgba(6, 78, 59, 0.8)"/>
    <rect x="0" y="24" width="360" height="10" fill="rgba(6, 78, 59, 0.8)"/>
    <text x="180" y="22" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">100%-BAN BETEGSZABADSÁG (TL-02)</text>

    <text x="18" y="56" fill="#34d399" font-size="10.5" font-weight="700">Jogcím: Mt. 126. § Betegszabadság</text>
    <text x="18" y="78" fill="#e2e8f0" font-size="9.5">• Teljes időtartam a 15 napos kereten belül van</text>
    <text x="18" y="96" fill="#e2e8f0" font-size="9.5">• <tspan fill="#34d399" font-weight="600">Munkáltató fizeti:</tspan> Távolléti díj 70%-a</text>
    <text x="18" y="114" fill="#e2e8f0" font-size="9.5">• Bérköltségként számfejtendő tétel</text>
    <text x="18" y="132" fill="#e2e8f0" font-size="9.5">• Keretegyenleg csökken a felhasznált napokkal</text>

    <!-- Naptár szimbolika -->
    <rect x="18" y="148" width="324" height="42" rx="4" fill="rgba(15, 23, 42, 0.7)" stroke="#059669" stroke-width="1"/>
    <text x="28" y="166" fill="#a7f3d0" font-size="9" font-weight="600">Naptári megjelenés:</text>
    <text x="28" y="180" fill="#cbd5e1" font-size="8.5">Egységes zöld/kék csík [TL-02: Betegszabadság (100%)]</text>
  </g>

  <!-- ==================== BRANCH RIGHT: IGEN (Automatikus Split) ==================== -->
  <!-- Arrow right and down -->
  <path d="M 860 390 L 1080 390 L 1080 480" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="940" y="372" width="80" height="20" rx="4" fill="rgba(136, 19, 55, 0.9)" stroke="#fb7185" stroke-width="1"/>
  <text x="980" y="386" fill="#fecdd3" font-size="9.5" font-weight="700" text-anchor="middle">IGEN (&gt; 15)</text>

  <!-- Box Branch Right: Automatikus Kettéválasztás -->
  <g transform="translate(860, 480)">
    <rect width="440" height="210" rx="8" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1.5"/>
    <rect width="440" height="34" rx="8" fill="rgba(136, 19, 55, 0.8)"/>
    <rect x="0" y="24" width="440" height="10" fill="rgba(136, 19, 55, 0.8)"/>
    <text x="220" y="22" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">AUTOMATIKUS KETTÉVÁLASZTÁS (SPLIT)</text>

    <!-- Sub-phase A: Betegszabi -->
    <g transform="translate(14, 46)">
      <rect width="412" height="66" rx="5" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="12" y="20" fill="#34d399" font-size="10" font-weight="700">1. Szakasz (1..K_maradek napig): BETEGSZABADSÁG</text>
      <text x="12" y="36" fill="#e2e8f0" font-size="9">• Munkáltató fizeti (70%-os távolléti díj)</text>
      <text x="12" y="52" fill="#a7f3d0" font-size="9">• Tárgyévi betegszabadság keretegyenleg lecsökken 0-ra</text>
    </g>

    <!-- Sub-phase B: Táppénz -->
    <g transform="translate(14, 122)">
      <rect width="412" height="74" rx="5" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
      <text x="12" y="20" fill="#c4b5fd" font-size="10" font-weight="700">2. Szakasz ((K_maradek + 1)..végig): TÁPPÉNZ (TL-03)</text>
      <text x="12" y="36" fill="#e2e8f0" font-size="9">• <tspan fill="#fb7185" font-weight="700">Munkáltatói KIESŐ IDŐ</tspan> (bérfizetés = 0 Ft)</text>
      <text x="12" y="52" fill="#e2e8f0" font-size="9">• NEAK által folyósított pénzbeli egészségbiztosítási ellátás</text>
      <text x="12" y="66" fill="#ddd6fe" font-size="9">• Munkáltatói 1/3-os hozzájárulási kötelezettség alapja</text>
    </g>
  </g>

  <!-- ==================== CONVERGENCE: EXPORT ÉS BÉRFELADÁS ==================== -->
  <!-- Connector arrows to bottom block -->
  <path d="M 260 690 L 260 725 L 640 725 L 640 745" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 1080 690 L 1080 725 L 720 725 L 720 745" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <g transform="translate(80, 745)">
    <rect width="1220" height="120" rx="8" fill="rgba(30, 41, 59, 0.9)" stroke="#475569" stroke-width="1.5"/>
    
    <text x="24" y="26" fill="#f8fafc" font-size="11" font-weight="700">A RENDSZER ÁLTAL GARANTÁLT AUTOMATIKUS KIMENETEK</text>

    <!-- 3 output columns -->
    <!-- Col 1: Rács -->
    <g transform="translate(24, 38)">
      <rect width="365" height="66" rx="5" fill="rgba(15, 23, 42, 0.7)" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-size="10" font-weight="700">1. Naptárrács Megjelenítés</text>
      <text x="14" y="40" fill="#cbd5e1" font-size="9">A cellák automatikusan két különböző</text>
      <text x="14" y="54" fill="#cbd5e1" font-size="9">színkóddal jelzik a váltás pontos fordulónapját</text>
    </g>

    <!-- Col 2: Havi Munkaidő-jegyzék -->
    <g transform="translate(425, 38)">
      <rect width="370" height="66" rx="5" fill="rgba(15, 23, 42, 0.7)" stroke="#059669" stroke-width="1"/>
      <text x="14" y="22" fill="#34d399" font-size="10" font-weight="700">2. Hivatalos Excel &amp; PDF Export</text>
      <text x="14" y="40" fill="#cbd5e1" font-size="9">Külön összesítő soron jelenik meg a</text>
      <text x="14" y="54" fill="#cbd5e1" font-size="9">Betegszabadság órák és a Táppénz napok száma</text>
    </g>

    <!-- Col 3: Bérszámfejtési Híd -->
    <g transform="translate(830, 38)">
      <rect width="365" height="66" rx="5" fill="rgba(15, 23, 42, 0.7)" stroke="#7c3aed" stroke-width="1"/>
      <text x="14" y="22" fill="#c4b5fd" font-size="10" font-weight="700">3. Bérszámfejtési Feladás (Híd)</text>
      <text x="14" y="40" fill="#cbd5e1" font-size="9">A könyvelőprogram két külön tételként</text>
      <text x="14" y="54" fill="#cbd5e1" font-size="9">kapja meg, nulla kézi számolási hibalehetőséggel</text>
    </g>
  </g>
</svg>